[package]
name = "gb-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Game Boy emulation core (no I/O; only serde+bincode for save states)"

[dependencies]
bincode = "1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
