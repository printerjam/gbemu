[package]
name = "gb-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windowed frontend"

[[bin]]
name = "gbemu"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
gb-core = { path = "../gb-core" }
gilrs = { version = "0.11.2", optional = true }
minifb = "0.28.0"
png = "0.18.1"

[features]
gamepad = ["dep:gilrs"]
